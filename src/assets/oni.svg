<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <!-- Wave app icon: a white hannya-style oni mask on a vermilion tile.
       Palette: vermilion, washi white, gold, sumi ink. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e2262b"/>
      <stop offset="1" stop-color="#9c0c16"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.7" stop-color="#f3e9d6"/>
      <stop offset="1" stop-color="#ddc9a8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.5" stop-color="#f2c255"/>
      <stop offset="1" stop-color="#b98222"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a8741c"/>
      <stop offset="0.5" stop-color="#f0c45a"/>
      <stop offset="1" stop-color="#fff4c8"/>
    </linearGradient>
    <linearGradient id="tooth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eadfc8"/>
    </linearGradient>

    <!-- Left half of the symmetric parts; the right half is its mirror. -->
    <g id="half">
      <!-- crescent horn with ring bands -->
      <path d="M160,200 C116,174 82,124 74,38 C102,96 150,138 214,158 Z" fill="url(#horn)" stroke="#1a0d0b" stroke-width="8" stroke-linejoin="round"/>
      <path d="M112,150 C126,140 144,140 160,150" fill="none" stroke="#9a6a1c" stroke-width="5" stroke-linecap="round"/>
      <path d="M92,108 C102,100 116,100 128,106" fill="none" stroke="#9a6a1c" stroke-width="4" stroke-linecap="round"/>
      <!-- kumadori: red sweep from the eye over the brow to the temple -->
      <path d="M236,252 C206,206 166,190 124,200 C166,200 200,220 228,262 Z" fill="#d11a22"/>
      <!-- flame brow -->
      <path d="M250,212 C226,176 190,160 146,168 C178,156 226,166 256,200 Z" fill="#1a0d0b"/>
      <!-- eye -->
      <path d="M150,238 C178,224 216,236 238,260 C206,270 170,262 150,238 Z" fill="url(#gold)" stroke="#1a0d0b" stroke-width="7" stroke-linejoin="round"/>
      <ellipse cx="198" cy="250" rx="6" ry="13" fill="#1a0d0b" transform="rotate(-20 198 250)"/>
      <!-- red under the eye and on the cheek -->
      <path d="M148,272 C178,294 214,292 238,276 C212,290 176,290 148,272 Z" fill="#d11a22"/>
      <path d="M136,300 C156,330 186,344 214,340 C186,336 160,322 136,300 Z" fill="#d11a22"/>
      <!-- nostril -->
      <path d="M240,312 C232,318 232,326 242,328" fill="none" stroke="#1a0d0b" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="fangs-half">
      <path d="M190,358 L201,392 L212,358 Z" fill="url(#tooth)" stroke="#1a0d0b" stroke-width="5" stroke-linejoin="round"/>
      <path d="M194,412 C192,386 196,358 208,334 C216,360 220,386 218,414 Z" fill="url(#tooth)" stroke="#1a0d0b" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#tile)"/>
  <rect x="26" y="26" width="460" height="460" rx="96" fill="none" stroke="#f0c45a" stroke-width="5" opacity="0.9"/>
  <!-- gold sun rings behind the mask -->
  <circle cx="256" cy="268" r="192" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <circle cx="256" cy="268" r="174" fill="none" stroke="#f0c45a" stroke-width="2.5" opacity="0.8"/>

  <g transform="translate(256 274) scale(0.84) translate(-256 -256)">
    <!-- face -->
    <path d="M256,116 C194,116 144,142 124,198 C110,238 114,278 124,314 C134,352 150,384 172,410 C198,440 228,454 256,454 C284,454 314,440 340,410 C362,384 378,352 388,314 C398,278 402,238 388,198 C368,142 318,116 256,116 Z"
          fill="url(#skin)" stroke="#1a0d0b" stroke-width="10" stroke-linejoin="round"/>
    <!-- gold mark on the forehead -->
    <path d="M256,150 L267,174 L256,196 L245,174 Z" fill="url(#gold)" stroke="#1a0d0b" stroke-width="5" stroke-linejoin="round"/>

    <use href="#half" xlink:href="#half"/>
    <use href="#half" xlink:href="#half" transform="translate(512 0) scale(-1 1)"/>

    <!-- mouth: red lips around a dark opening -->
    <path d="M162,346 C202,330 310,330 350,346 C342,398 302,426 256,428 C210,426 170,398 162,346 Z" fill="#c8161d" stroke="#1a0d0b" stroke-width="8" stroke-linejoin="round"/>
    <path d="M180,352 C214,344 298,344 332,352 C324,390 294,410 256,412 C218,410 188,390 180,352 Z" fill="#3a0509"/>
    <path d="M184,354 C220,346 292,346 328,354 L324,368 C290,362 222,362 188,368 Z" fill="url(#tooth)" stroke="#1a0d0b" stroke-width="4" stroke-linejoin="round"/>
    <use href="#fangs-half" xlink:href="#fangs-half"/>
    <use href="#fangs-half" xlink:href="#fangs-half" transform="translate(512 0) scale(-1 1)"/>
  </g>
</svg>
