# iOS build on a cloud Mac: a simulator smoke test (launch, screenshot, app log) and an
# unsigned Oni.ipa (signed later on the phone, see docs/ios-signing.md).
# macOS minutes count ×10 on a private repo (90% of the 2,000 free a month were gone on
# 22.10.2026). A version tag only builds the IPA the release needs (~1.5 min, ~20 billed); the
# simulator smoke test (~3 min more) runs when started by hand, once per batch of iOS changes.
name: ios

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Build for the simulator and run the smoke test
        type: boolean
        default: true
  push:
    tags: ['v*']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true
      - run: npm ci
      - name: Web build and sync
        run: |
          npx vite build
          npx cap sync ios

      - name: Simulator build
        if: github.event_name == 'workflow_dispatch' && inputs.smoke
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build | tail -40
          # Ad-hoc signed ("sign to run locally"), so the Keychain works as on a phone.
      - name: Smoke test on a simulator
        if: github.event_name == 'workflow_dispatch' && inputs.smoke
        run: |
          # The Debug bridge logs plugin calls, the token and the Authorization header among them:
          # take it out of both logs before anything prints them or uploads them, however the step ends.
          scrub() { [ -n "$ONI_TEST_TOKEN" ] && perl -pi -e 's/\Q$ENV{ONI_TEST_TOKEN}\E/***/g' console.log app.log 2>/dev/null || true; }
          trap scrub EXIT
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in sorted(devices.items(), reverse=True) if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')))")
          echo "device $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/sim/Build/Products/Debug-iphonesimulator/App.app
          # A stand-in PC for the home-network link (src/ios-smoke.ts, lanLink).
          node tests/lan-echo.mjs > lan-echo.log 2>&1 &
          xcrun simctl spawn "$DEVICE" log stream --level debug --style compact --predicate 'process == "App"' > app.log 2>&1 &
          LOG=$!
          # Capacitor prints the page's console to stdout, not to the system log.
          # SIMCTL_CHILD_* reaches the app's environment: the Debug build signs in with the token
          # and runs src/ios-smoke.ts, which prints "SMOKE <step> ok|FAIL" lines.
          SIMCTL_CHILD_ONI_TEST_TOKEN="$ONI_TEST_TOKEN" xcrun simctl launch --console-pty "$DEVICE" local.wave.player > console.log 2>&1 &
          APP=$!
          shot() { xcrun simctl io "$DEVICE" screenshot "$1"; }
          # The page's memory, once a second (the web content processes on this Mac: the simulator's
          # run here): a friend's iPhone reloaded Oni after History then Liked, and after Next with
          # Now Playing open — iOS ends a page that takes too much. ms, pid, RSS in KB.
          ( while true; do
              now=$(perl -MTime::HiRes=time -e 'printf "%d", time*1000')
              for p in $(pgrep -f 'com.apple.WebKit.WebContent'); do echo "$now $p $(ps -o rss= -p "$p" | tr -d ' ')"; done
              sleep 1
            done ) > mem.log 2>/dev/null &
          MEM=$!
          for i in $(seq 1 120); do grep -q "SMOKE playback" console.log && break; sleep 1; done
          shot playing.png
          for i in $(seq 1 60); do grep -q "SMOKE offline-playback" console.log && break; sleep 1; done
          shot now-playing.png
          # Up to 5 min: the fast-start step plays on a held-back network for a minute or two.
          for i in $(seq 1 300); do grep -q "SMOKE done" console.log && break; sleep 1; done
          shot search-link.png
          # The native player in the background: away to Settings for 25 s, then back
          # (src/ios-smoke.ts, backgroundProbe, reports whether the music and the page ran).
          xcrun simctl launch "$DEVICE" com.apple.Preferences > /dev/null || true
          sleep 25
          xcrun simctl launch "$DEVICE" local.wave.player > /dev/null || true
          for i in $(seq 1 20); do grep -q "SMOKE background-life" console.log && break; sleep 1; done
          # Back in front the shell finds the page "black" (the probe says so) and loads it anew.
          for i in $(seq 1 60); do grep -q "SMOKE revived" console.log && break; sleep 1; done
          shot revived.png
          kill $LOG $APP $MEM || true
          # Pictures the smoke run took of Oni's own window (OniPlayer.snapshot).
          cp "$(xcrun simctl get_app_container "$DEVICE" local.wave.player data)"/Documents/shot-*.png . 2>/dev/null || true
          scrub
          echo "--- smoke ---"
          grep "SMOKE" console.log || true
          echo "--- the stand-in PC (lan-echo) ---"
          cat lan-echo.log || true
          echo "--- errors ---"
          grep -E "not implemented|TypeError|ReferenceError|SyntaxError|keychain\] read failed|\[error\]" console.log | head -20 || true
          grep -q "SMOKE done" console.log || { echo "::error::the smoke run did not finish"; exit 1; }
          grep -q "SMOKE revived" console.log || { echo "::error::the page was not loaded anew after it showed nothing"; exit 1; }
          if grep -q "SMOKE .* FAIL" console.log; then echo "::error::a smoke step failed"; exit 1; fi
        env:
          ONI_TEST_TOKEN: ${{ secrets.YANDEX_MUSIC_TOKEN }}

      - name: Unsigned IPA
        run: |
          set -o pipefail
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" build | tail -20
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/App.app Payload/
          # Signed here only to carry the entitlements (the app group the widget reads what plays
          # from): SideStore reads them from the signature and signs it all again on the phone.
          find Payload/App.app/Frameworks -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign -f -s - {} \; 2>/dev/null || true
          codesign -f -s - --entitlements ios/App/OniActivity/OniActivity.entitlements Payload/App.app/PlugIns/OniActivity.appex
          codesign -f -s - --entitlements ios/App/App/App.entitlements Payload/App.app
          codesign -d --entitlements - Payload/App.app 2>&1 | grep -c application-groups
          zip -qry "Oni-$VERSION.ipa" Payload
          ls -la *.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: |
            playing.png
            now-playing.png
            search-link.png
            revived.png
            shot-*.png
            mem.log
            app.log
            console.log
            *.ipa
          if-no-files-found: ignore
