# iOS build on a cloud Mac: a simulator smoke test (launch, screenshot, app log) and an
# unsigned Oni.ipa (signed later on the phone, see docs/ios-signing.md).
# macOS minutes count ×10 on a private repo, so this runs only when the iOS side changes,
# on version tags, and by hand.
name: ios

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main, 'feat/ios*']
    paths: ['ios/**', 'capacitor.config.ts', 'src/api/capacitor.ts', '.github/workflows/ios.yml']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true
      - run: npm ci
      - name: Web build and sync
        run: |
          npx vite build
          npx cap sync ios

      - name: Simulator build
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build | tail -40
          # Ad-hoc signed ("sign to run locally"), so the Keychain works as on a phone.
      - name: Smoke test on a simulator
        run: |
          # The Debug bridge logs plugin calls, the token and the Authorization header among them:
          # take it out of both logs before anything prints them or uploads them, however the step ends.
          scrub() { [ -n "$ONI_TEST_TOKEN" ] && perl -pi -e 's/\Q$ENV{ONI_TEST_TOKEN}\E/***/g' console.log app.log 2>/dev/null || true; }
          trap scrub EXIT
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in sorted(devices.items(), reverse=True) if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')))")
          echo "device $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/sim/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl spawn "$DEVICE" log stream --level debug --style compact --predicate 'process == "App"' > app.log 2>&1 &
          LOG=$!
          # Capacitor prints the page's console to stdout, not to the system log.
          # SIMCTL_CHILD_* reaches the app's environment: the Debug build signs in with the token
          # and runs src/ios-smoke.ts, which prints "SMOKE <step> ok|FAIL" lines.
          SIMCTL_CHILD_ONI_TEST_TOKEN="$ONI_TEST_TOKEN" xcrun simctl launch --console-pty "$DEVICE" local.wave.player > console.log 2>&1 &
          APP=$!
          shot() { xcrun simctl io "$DEVICE" screenshot "$1"; }
          for i in $(seq 1 120); do grep -q "SMOKE playback" console.log && break; sleep 1; done
          shot playing.png
          for i in $(seq 1 60); do grep -q "SMOKE link-ready" console.log && break; sleep 1; done
          shot now-playing.png
          # What an iPhone shortcut does: open the app's link (src/ui/links.ts).
          xcrun simctl openurl "$DEVICE" "oni://search?text=%D0%9A%D0%B8%D0%BD%D0%BE+%D0%93%D1%80%D1%83%D0%BF%D0%BF%D0%B0+%D0%BA%D1%80%D0%BE%D0%B2%D0%B8" || true
          for i in $(seq 1 60); do grep -q "SMOKE done" console.log && break; sleep 1; done
          shot search-link.png
          kill $LOG $APP || true
          scrub
          echo "--- smoke ---"
          grep "SMOKE" console.log || true
          echo "--- errors ---"
          grep -E "not implemented|TypeError|ReferenceError|SyntaxError|keychain\] read failed|\[error\]" console.log | head -20 || true
          grep -q "SMOKE done" console.log || { echo "::error::the smoke run did not finish"; exit 1; }
          if grep -q "SMOKE .* FAIL" console.log; then echo "::error::a smoke step failed"; exit 1; fi
        env:
          ONI_TEST_TOKEN: ${{ secrets.YANDEX_MUSIC_TOKEN }}

      - name: Unsigned IPA
        run: |
          set -o pipefail
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" build | tail -20
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "Oni-$VERSION.ipa" Payload
          ls -la *.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: |
            playing.png
            now-playing.png
            search-link.png
            app.log
            console.log
            *.ipa
          if-no-files-found: ignore
